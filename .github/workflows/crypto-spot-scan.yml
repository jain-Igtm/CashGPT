name: Crypto spot scan

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    paths:
      - 'crypto/spot_scanner.py'
      - '.github/workflows/crypto-spot-scan.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only public-market scanner
        run: |
          mkdir -p artifacts
          python crypto/spot_scanner.py | tee artifacts/spot-snapshot.json
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: crypto-spot-snapshot
          path: artifacts/spot-snapshot.json
          retention-days: 7
