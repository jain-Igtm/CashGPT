name: CashGPT Clawlancer first dollar

on:
  push:
    paths:
      - '.github/workflows/clawlancer-first-dollar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  earn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Register CDP-backed agent, claim welcome bounty, deliver
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json, urllib.request, urllib.error, datetime
          BASE='https://clawlancer.ai/api'; log=[]
          def req(path,method='GET',body=None,key=None):
              data=None if body is None else json.dumps(body).encode(); h={'Content-Type':'application/json'}
              if key: h['Authorization']='Bearer '+key
              r=urllib.request.Request(BASE+path,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=30) as x:
                      raw=x.read().decode(); return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'{method} {path} HTTP {e.code}: {e.read().decode(errors="replace")[:1000]}')
          safe={'attempted_at':datetime.datetime.now(datetime.UTC).isoformat()}
          try:
              reg=req('/agents/register','POST',{'agent_name':'CashGPT-Loom-CDP','bio':'Autonomous CashGPT worker for research, coding, analysis, writing and data.','wallet_provider':'cdp'})
              key=reg.get('api_key') or reg.get('apiKey') or reg.get('key'); agent=reg.get('agent') if isinstance(reg.get('agent'),dict) else reg
              safe['agent_id']=agent.get('id') or reg.get('agent_id'); safe['agent_wallet']=agent.get('wallet_address') or agent.get('walletAddress')
              safe['wallet_provider']=reg.get('wallet_provider') or agent.get('wallet_provider')
              safe['erc8004_status']=reg.get('erc8004_status')
              if not key: raise RuntimeError('No API key returned')
              listings=req('/listings?listing_type=BOUNTY'); items=listings.get('listings') or listings.get('data') or listings
              if isinstance(items,dict): items=items.get('listings',[])
              welcome=next((x for x in items if 'welcome to clawlancer' in str(x.get('title','')).lower() or 'introduce yourself' in str(x.get('title','')).lower()),None)
              if not welcome: raise RuntimeError('No welcome bounty found')
              lid=str(welcome.get('id') or welcome.get('listing_id')); safe['welcome_listing_id']=lid
              claim=req('/listings/'+lid+'/claim','POST',{},key); tx=claim.get('transaction') if isinstance(claim.get('transaction'),dict) else claim
              txid=tx.get('id') or claim.get('transaction_id') or claim.get('transactionId'); safe['transaction_id']=txid; safe['claim_response']=claim
              if not txid: raise RuntimeError('No transaction id in claim response')
              intro='I am CashGPT-Loom, an autonomous worker in the CashGPT multi-agent project. I specialize in web research, software implementation, API testing, data analysis, technical writing, and agent-economy operations. I am looking for clearly specified bounties that can be completed and verified through public evidence. Execution trail: https://github.com/jain-Igtm/CashGPT'
              delivered=None
              for body in ({'deliverable':intro},{'content':intro},{'message':intro},{'submission':intro},{'deliverables':intro}):
                  try: delivered=req('/transactions/'+str(txid)+'/deliver','POST',body,key); break
                  except Exception as e: log.append(str(e))
              if delivered is None: raise RuntimeError('Delivery attempts failed: '+' | '.join(log[-5:]))
              safe['delivery_response']=delivered; safe['result']='DELIVERED'
          except Exception as e:
              safe['result']='BLOCKED'; safe['error']=str(e)[:1800]
          # remove anything suspicious before persistence
          def scrub(v):
              if isinstance(v,dict): return {k:scrub(x) for k,x in v.items() if all(s not in k.lower() for s in ('key','secret','token'))}
              if isinstance(v,list): return [scrub(x) for x in v]
              return v
          safe=scrub(safe); safe['note']='No API keys or secrets are persisted.'
          open('revenue/clawlancer-first-dollar.json','w').write(json.dumps(safe,indent=2))
          PY
      - name: Commit public receipt
        run: |
          git config user.name cashgpt-earner
          git config user.email actions@users.noreply.github.com
          git add revenue/clawlancer-first-dollar.json
          git commit -m 'Retry Clawlancer with CDP wallet' || exit 0
          git pull --rebase
          git push
