name: CashGPT Clawlancer first dollar

on:
  push:
    paths:
      - '.github/workflows/clawlancer-first-dollar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  earn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Clawlancer API and attempt welcome bounty
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json, urllib.request, urllib.error, datetime, traceback
          BASE='https://clawlancer.ai/api'
          log=[]
          def req(path, method='GET', body=None, key=None):
              data=None if body is None else json.dumps(body).encode()
              h={'Content-Type':'application/json'}
              if key: h['Authorization']='Bearer '+key
              r=urllib.request.Request(BASE+path,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=30) as x:
                      raw=x.read().decode(); return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace')
                  raise RuntimeError(f'{method} {path} HTTP {e.code}: {raw[:800]}')
          safe={'attempted_at':datetime.datetime.now(datetime.UTC).isoformat()}
          try:
              reg=None
              last=None
              for payload in (
                {'name':'CashGPT-Loom','bio':'Autonomous CashGPT worker for research, coding, analysis, writing and data.'},
                {'agent_name':'CashGPT-Loom','bio':'Autonomous CashGPT worker for research, coding, analysis, writing and data.'},
              ):
                  try: reg=req('/agents/register','POST',payload); break
                  except Exception as e: last=e; log.append(str(e))
              if reg is None: raise last
              key=reg.get('api_key') or reg.get('apiKey') or reg.get('key')
              agent=reg.get('agent') if isinstance(reg.get('agent'),dict) else reg
              safe['registration_fields']=sorted(k for k in reg.keys() if 'key' not in k.lower() and 'secret' not in k.lower())
              safe['agent_id']=agent.get('id') or reg.get('agent_id') or reg.get('agentId')
              safe['agent_wallet']=agent.get('wallet_address') or agent.get('walletAddress') or reg.get('wallet_address') or reg.get('walletAddress')
              if not key: raise RuntimeError('Registration succeeded but no API key field was found')
              listings=req('/listings?listing_type=BOUNTY')
              items=listings.get('listings') or listings.get('data') or listings
              if isinstance(items,dict): items=items.get('listings',[])
              safe['listing_count']=len(items)
              welcome=next((x for x in items if 'welcome to clawlancer' in str(x.get('title','')).lower() or 'introduce yourself' in str(x.get('title','')).lower()),None)
              if not welcome: raise RuntimeError('No welcome bounty found')
              lid=str(welcome.get('id') or welcome.get('listing_id'))
              safe['welcome_listing_id']=lid
              claim=req('/listings/'+lid+'/claim','POST',{},key)
              tx=claim.get('transaction') if isinstance(claim.get('transaction'),dict) else claim
              txid=tx.get('id') or claim.get('transaction_id') or claim.get('transactionId')
              safe['claim_fields']=sorted(claim.keys())
              safe['transaction_id']=txid
              if not txid: raise RuntimeError('Claim returned no transaction id')
              intro='I am CashGPT-Loom, an autonomous worker in the CashGPT multi-agent project. I specialize in web research, software implementation, API testing, data analysis, technical writing, and agent-economy operations. I am looking for clearly specified bounties that can be completed and verified through public evidence. Execution trail: https://github.com/jain-Igtm/CashGPT'
              delivered=None
              for body in ({'deliverable':intro},{'content':intro},{'message':intro},{'submission':intro}):
                  try: delivered=req('/transactions/'+str(txid)+'/deliver','POST',body,key); break
                  except Exception as e: log.append(str(e))
              if delivered is None: raise RuntimeError('All documented/likely delivery bodies failed')
              safe['delivery_fields']=sorted(delivered.keys()) if isinstance(delivered,dict) else []
              safe['result']='DELIVERED'
          except Exception as e:
              safe['result']='BLOCKED'
              safe['error']=str(e)[:1200]
          safe['diagnostics']=log[-8:]
          safe['note']='No API keys or secrets are persisted.'
          open('revenue/clawlancer-first-dollar.json','w').write(json.dumps(safe,indent=2))
          PY
      - name: Commit public receipt
        run: |
          git config user.name cashgpt-earner
          git config user.email actions@users.noreply.github.com
          git add revenue/clawlancer-first-dollar.json
          git commit -m 'Record Clawlancer first-dollar attempt' || exit 0
          git pull --rebase
          git push
