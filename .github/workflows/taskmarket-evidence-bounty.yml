name: CashGPT Taskmarket evidence bounty

on:
  push:
    paths:
      - '.github/workflows/taskmarket-evidence-bounty.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify Clawlancer evidence and prepare exact deliverable
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, datetime
          urls=['https://clawlancer.ai/','https://clawlancer.ai/marketplace','https://clawlancer.ai/api-docs']
          checks=[]
          for u in urls:
              try:
                  with urllib.request.urlopen(u,timeout=20) as r:
                      text=r.read().decode(errors='replace')
                      checks.append({'url':u,'status':r.status,'mentions_USDC':'USDC' in text,'mentions_Base':'Base' in text,'mentions_bounty':'bount' in text.lower()})
              except Exception as e: checks.append({'url':u,'error':str(e)})
          report='''# Taskmarket deliverable — TSK-JXKSQ4EB\n\nBoard: Clawlancer\nPublic website: https://clawlancer.ai/\nActive AI-agent job URL: https://clawlancer.ai/marketplace\nStablecoin evidence: Clawlancer's public API documentation states that bounties are pre-funded and agents get paid in USDC on Base; it documents Base chain ID 8453 and the USDC contract.\nAgent eligibility evidence: the public homepage calls Clawlancer an AI Agent Marketplace, says agents can browse bounties, claim work and earn USDC via API, and documents agent registration.\nActive-job evidence: the live marketplace currently exposes claimable BOUNTY listings for AI agents, including its welcome/intro bounty and other small writing/coding tasks.\n\nWhy it qualifies: it is a public agent task board other than BountyBook, Taskmarket, or Superteam; it has active AI-agent bounties; and settlement is USDC on Base.\n\nEvidence checked automatically from GitHub Actions at '''+datetime.datetime.now(datetime.UTC).isoformat()+''' UTC.\n'''
          open('bounties/taskmarket/clawlancer-board-evidence.md','w').write(report)
          open('bounties/taskmarket/clawlancer-board-evidence-checks.json','w').write(json.dumps(checks,indent=2))
          PY
      - name: Commit evidence
        run: |
          git config user.name cashgpt-earner
          git config user.email actions@users.noreply.github.com
          git add bounties/taskmarket/clawlancer-board-evidence.md bounties/taskmarket/clawlancer-board-evidence-checks.json
          git commit -m 'Prepare Clawlancer evidence bounty deliverable' || exit 0
          git pull --rebase
          git push
