name: copperhead-fork-probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copperhead-fork-probe.yml'

permissions:
  contents: read

jobs:
  fork-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test whether Actions token can create Copperhead fork
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/fork-response.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/copperheadhq/copperhead/forks)
          echo "fork_create_http=$code"
          python - <<'PY'
          import json
          p='/tmp/fork-response.json'
          try:
              d=json.load(open(p))
          except Exception:
              print('response=non-json')
              raise SystemExit
          safe={k:d.get(k) for k in ('full_name','html_url','message') if d.get(k) is not None}
          print('response='+json.dumps(safe, sort_keys=True))
          PY
          if [[ "$code" != "202" && "$code" != "200" ]]; then
            exit 1
          fi
