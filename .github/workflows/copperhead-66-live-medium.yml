name: copperhead-66-live-medium

on:
  push:
    paths:
      - '.github/workflows/copperhead-66-live-medium.yml'
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  medium-create:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COPPERHEAD_BASE_URL: https://models.github.ai/inference
      COPPERHEAD_API_KEY_ENV: GITHUB_TOKEN
      COPPERHEAD_MODEL: compat:openai/gpt-4.1-mini
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Install KiCad and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y kicad git
          node --version
          kicad-cli version

      - name: Clone current Copperhead main
        run: |
          git clone --depth 1 https://github.com/copperheadhq/copperhead.git copperhead
          cd copperhead
          echo "HEAD=$(git rev-parse HEAD)"
          npm ci
          npm run build

      - name: Probe GitHub Models compatibility without logging credentials
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/models.json -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Content-Type: application/json' \
            https://models.github.ai/inference/chat/completions \
            -d '{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Reply exactly OK"}],"max_tokens":4}')
          echo "github_models_http=$code"
          if [ "$code" != "200" ]; then
            python - <<'PY'
import json
p='/tmp/models.json'
try:
    d=json.load(open(p))
    print({'error': d.get('error', d)})
except Exception:
    print('non-json response')
PY
            exit 1
          fi
          python - <<'PY'
import json
j=json.load(open('/tmp/models.json'))
print('github_models_reply=', j.get('choices',[{}])[0].get('message',{}).get('content','')[:80])
PY

      - name: Initialize medium-run workspace
        run: |
          mkdir medium-run
          cd medium-run
          git init
          git config user.name "CashGPT CI"
          git config user.email "cashgpt-ci@users.noreply.github.com"
          git commit --allow-empty -m baseline

      - name: Run current-main medium create and preserve first blocker
        id: create
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd medium-run
          ../copperhead/dist/cli.js create --brief ../copperhead/examples/medium/esp32-soil-sensor.md 2>&1 | tee ../copperhead-66-medium.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" | tee -a ../copperhead-66-medium.log
          exit "$status"

      - name: Snapshot resulting repo state
        if: always()
        run: |
          {
            echo '=== CREATE STEP OUTCOME ==='
            echo '${{ steps.create.outcome }}'
            echo '=== TREE ==='
            find medium-run -maxdepth 4 -type f -not -path '*/.git/*' -print | sort
            echo '=== GIT STATUS ==='
            git -C medium-run status --short || true
            echo '=== GIT LOG ==='
            git -C medium-run log --oneline --decorate -20 || true
          } | tee copperhead-66-state.txt

      - name: Upload transcript and state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copperhead-66-medium-live
          path: |
            copperhead-66-medium.log
            copperhead-66-state.txt
            medium-run/.copperhead/
            medium-run/docs/
            medium-run/hardware/
            medium-run/outputs/
            medium-run/firmware/
          if-no-files-found: warn

      - name: Fail if create did not exit 0
        if: steps.create.outcome != 'success'
        run: exit 1
