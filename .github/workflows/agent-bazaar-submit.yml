name: agent-bazaar-submit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/agent-bazaar-submit.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Submit CashGPT skill for review
        env:
          PRODUCT_NAME: Base Wallet Risk Snapshot
          PRODUCT_DESCRIPTION: Cheap machine-readable preflight for autonomous agents interacting with public Base/EVM wallet addresses. Produces a strict JSON risk snapshot, never requests signing credentials, and returns unknown rather than fabricating unavailable chain data.
          PRODUCT_PRICE: '0.005'
        run: |
          cat > /tmp/submit.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          let result = { attempted: false, submitted: false, error: null };
          try {
            await page.goto('https://www.agent-bazaar.com/dev', {waitUntil:'networkidle', timeout:60000});
            const template = page.getByRole('button', {name:/skill template/i});
            if (await template.count()) { await template.click(); await page.waitForTimeout(500); }

            const controls = await page.locator('input,textarea,select,button').evaluateAll(els => els.map((e,i) => ({i,tag:e.tagName,text:(e.textContent||'').trim(),ph:e.getAttribute('placeholder'),type:e.getAttribute('type'),value:e.value,disabled:e.disabled,name:e.getAttribute('name')})));
            console.log('CONTROLS_JSON', JSON.stringify(controls));

            const name = page.locator('input[placeholder*="GPT-4 Code Review"]');
            if (await name.count()) await name.first().fill(process.env.PRODUCT_NAME);
            else if (await page.locator('input[type="text"]').count()) await page.locator('input[type="text"]').first().fill(process.env.PRODUCT_NAME);

            const ta = page.locator('textarea');
            if (await ta.count()) await ta.first().fill(process.env.PRODUCT_DESCRIPTION);

            const price = page.locator('input[placeholder="0.05"], input[type="number"]');
            if (await price.count()) await price.first().fill(process.env.PRODUCT_PRICE);

            const nativeSelects = page.locator('select');
            for (let i=0;i<await nativeSelects.count();i++) {
              const s=nativeSelects.nth(i);
              const opts=await s.locator('option').evaluateAll(os=>os.map(o=>({v:o.value,t:o.textContent||''})));
              console.log('SELECT_OPTIONS',i,JSON.stringify(opts));
              const choice=opts.find(o=>/skill/i.test(o.t)) || opts.find(o=>/trading|data|security|crypto/i.test(o.t)) || opts.find(o=>o.v);
              if(choice?.v) await s.selectOption(choice.v);
            }

            const submit = page.getByRole('button', {name:/submit for review/i});
            result.attempted = true;
            console.log('SUBMIT_STATE', JSON.stringify({count:await submit.count(), disabled:await submit.isDisabled().catch(()=>null)}));
            if (!await submit.count()) throw new Error('submit button not found');
            if (await submit.isDisabled()) throw new Error('submit button disabled after fields filled');
            await submit.click();
            await page.waitForTimeout(5000);
            const body=(await page.locator('body').innerText());
            console.log('AFTER_BODY', body.slice(-6000));
            result.submitted = /submitted|thank you|under review|success/i.test(body);
          } catch (e) {
            result.error = String(e?.stack || e);
            console.log('ATTEMPT_ERROR', result.error);
          } finally {
            await page.screenshot({path:'agent-bazaar-submit.png', fullPage:true}).catch(()=>{});
            const body=(await page.locator('body').innerText().catch(()=>''));
            await import('node:fs').then(fs=>fs.writeFileSync('agent-bazaar-result.json', JSON.stringify({...result, finalUrl:page.url(), bodyTail:body.slice(-8000)}, null, 2)));
            await browser.close();
          }
          JS
          node /tmp/submit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-bazaar-submit-evidence
          path: |
            agent-bazaar-submit.png
            agent-bazaar-result.json
