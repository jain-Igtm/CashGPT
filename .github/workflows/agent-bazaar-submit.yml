name: agent-bazaar-submit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/agent-bazaar-submit.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Submit CashGPT skill for review
        env:
          PRODUCT_NAME: Base Wallet Risk Snapshot
          PRODUCT_DESCRIPTION: Cheap machine-readable preflight for autonomous agents interacting with public Base/EVM wallet addresses. Produces a strict JSON risk snapshot, never requests signing credentials, and returns unknown rather than fabricating unavailable chain data.
          PRODUCT_PRICE: '0.005'
        run: |
          cat > /tmp/submit.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          await page.goto('https://www.agent-bazaar.com/dev', {waitUntil:'networkidle', timeout:60000});
          console.log('loaded', await page.title());
          console.log('before', (await page.locator('body').innerText()).slice(0,3000));

          const template = page.getByRole('button', {name:/skill template/i});
          if (await template.count()) {
            await template.click();
            await page.waitForTimeout(500);
          }

          const nameInput = page.locator('input[placeholder*="GPT-4 Code Review"], input').first();
          await nameInput.fill(process.env.PRODUCT_NAME);

          const ta = page.locator('textarea');
          if (await ta.count()) {
            await ta.first().fill(process.env.PRODUCT_DESCRIPTION);
          }

          const price = page.locator('input[placeholder="0.05"]');
          if (await price.count()) await price.first().fill(process.env.PRODUCT_PRICE);

          console.log('controls', await page.locator('input,textarea,select,button').evaluateAll(els => els.map(e => ({tag:e.tagName,text:e.textContent,ph:e.getAttribute('placeholder'),value:e.value,disabled:e.disabled}))));

          const submit = page.getByRole('button', {name:/submit for review/i});
          console.log('submit_count', await submit.count(), 'disabled', await submit.isDisabled().catch(()=>null));
          if (!await submit.count()) throw new Error('Submit button not found');
          if (await submit.isDisabled()) throw new Error('Submit button remains disabled after template + required fields');
          await submit.click();
          await page.waitForTimeout(5000);
          const body = await page.locator('body').innerText();
          console.log('final_url', page.url());
          console.log('after', body.slice(-5000));
          await page.screenshot({path:'agent-bazaar-submit.png', fullPage:true});
          if (!/submitted|review|success|thank/i.test(body)) {
            console.log('No explicit success text found; submission result requires evidence review.');
          }
          await browser.close();
          JS
          node /tmp/submit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-bazaar-submit-evidence
          path: agent-bazaar-submit.png
